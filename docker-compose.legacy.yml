version: '3.8'
services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PGHOST: db
      PGUSER: api_user
      PGPASSWORD: sidnei1982
      PGDATABASE: apidb
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: api_user
      POSTGRES_PASSWORD: sidnei1982
      POSTGRES_DB: apidb
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
