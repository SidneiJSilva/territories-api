services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      PGHOST: db
      PGUSER: territories_user
      PGPASSWORD: territories_dev
      PGDATABASE: territories
      PGPORT: 5432
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: territories_user
      POSTGRES_PASSWORD: territories_dev
      POSTGRES_DB: territories
    volumes:
      - territories_db_data:/var/lib/postgresql/data

volumes:
  territories_db_data: